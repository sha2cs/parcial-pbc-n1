<section class="tarjeta">
  <h2>Mi canción favorita</h2>
  <p class="titulo">🎵 {{ titulo }}</p>
  <p>{{ artista }}</p>
  <p><em>{{ motivo }}</em></p>

  <div class="acciones-cancion">
    <a [href]="enlace" target="_blank">Abrir en YouTube</a>
    <button type="button" class="btn-secundario" (click)="alternarReproductor()">
      {{ mostrarReproductor ? 'Ocultar reproductor' : 'Reproducir aquí' }}
    </button>
  </div>

  @if (mostrarReproductor) {
    <div class="reproductor">
      <iframe
        [src]="videoSeguro"
        title="Reproductor de YouTube"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  }
</section>
