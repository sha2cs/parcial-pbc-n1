<section class="tarjeta">
  <h2>Mi canción favorita</h2>
  <p class="titulo">🎵 {{ titulo }}</p>
  <p>{{ artista }}</p>
  <p><em>{{ motivo }}</em></p>

  <iframe [src]="reproductor" width="100%" height="220"
          title="Reproductor de la canción" allowfullscreen></iframe>

  <a [href]="enlace" target="_blank">Escuchar</a>
</section>
